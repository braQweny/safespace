name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Kolejny push na tę samą gałąź/PR unieważnia poprzedni przebieg testów.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run test
      - run: npm run test:db
      - run: npx astro sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:astro
      - run: npm run build
        env:
          # Ten artefakt służy wyłącznie testom, także w PR-ach Dependabota
          # i z forków. Job deploy buduje osobno z konfiguracją produkcyjną.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-public-key
      # Bundluje Workera z `src/worker.ts` bez poświadczeń. Klasa Durable
      # Object musi się pojawić w bindingach, inaczej deploy by jej nie utworzył.
      - name: Wrangler dry run
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run" | tee "$RUNNER_TEMP/wrangler-dry-run.log"
          grep -q "VoiceSessionObserver" "$RUNNER_TEMP/wrangler-dry-run.log"
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # `trace: "retain-on-failure"` zapisuje ślady tylko lokalnie w runnerze;
      # bez tego kroku nieudany E2E w CI nie zostawia niczego do obejrzenia.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    # Blokada `deploy-main` ma `queue: max`; zawieszona migracja nie może
    # trzymać jej przez domyślne 6 godzin i wstrzymać każdego kolejnego wdrożenia.
    timeout-minutes: 30
    # Jedna blokada obejmuje CAŁE wdrożenie: migrację oraz publikację Workera.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - name: Reject a superseded release before any production changes
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "This release was superseded by a newer main commit; production was not changed."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Create production secrets file
        run: node scripts/write-production-secrets.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPERATIONAL_LOG_HASH_SECRET: ${{ secrets.OPERATIONAL_LOG_HASH_SECRET }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      - name: Push Supabase migrations
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            if [ -z "$SUPABASE_URL" ]; then
              echo "SUPABASE_URL GitHub secret is required when SUPABASE_DB_PASSWORD is used for migrations." >&2
              exit 1
            fi

            SUPABASE_DB_PROJECT_REF="${SUPABASE_URL#https://}"
            SUPABASE_DB_PROJECT_REF="${SUPABASE_DB_PROJECT_REF%%.*}"
            SUPABASE_DB_POOLER_HOST="${SUPABASE_DB_POOLER_HOST:-aws-0-eu-west-1.pooler.supabase.com}"
            ENCODED_PASSWORD="$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')"
            SUPABASE_MIGRATION_DB_URL="postgresql://postgres.${SUPABASE_DB_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_DB_POOLER_HOST}:5432/postgres"
          elif [ -n "$SUPABASE_DB_URL" ]; then
            SUPABASE_MIGRATION_DB_URL="$SUPABASE_DB_URL"
          else
            echo "Set SUPABASE_DB_PASSWORD or SUPABASE_DB_URL as a GitHub secret for deployment migrations." >&2
            exit 1
          fi

          if [[ "$SUPABASE_MIGRATION_DB_URL" == *"@db."*".supabase.co:"* ]]; then
            echo "The migration connection string uses Supabase's direct database host, which requires IPv6 and fails on GitHub Actions." >&2
            echo "Use the Supabase Session Pooler connection string instead." >&2
            exit 1
          fi

          npx supabase db push --db-url "$SUPABASE_MIGRATION_DB_URL" --yes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: ${{ secrets.SUPABASE_DB_POOLER_HOST }}

      # Bez `wranglerVersion` akcja używa Wranglera z `npm ci` — tej samej
      # wersji, którą przechodzi audyt i dry run; przypięta ręcznie wersja
      # zostawała w tyle za package.json (Dependabot nie aktualizuje inputów).
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production
      - name: Remove production secrets file
        if: always()
        run: rm -f .env.production
      # Po publikacji sprawdza, że Worker odpowiada, a CSP ma prawdziwy origin
      # Supabase w `form-action` (CI testuje go tylko z adresem zastępczym;
      # bez niego logowanie przez Google ginie po cichu).
      - name: Smoke test the published Worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::warning::wrangler-action returned no deployment URL; smoke test skipped."
            exit 0
          fi
          headers="$(curl --silent --show-error --fail --retry 3 --retry-delay 5 --retry-all-errors --dump-header - --output /dev/null "$DEPLOYMENT_URL/auth/signin")"
          echo "$headers" | grep -qi "^x-safespace-request-id:" || { echo "Missing request id header" >&2; exit 1; }
          supabase_origin="$(node -p 'new URL(process.env.SUPABASE_URL).origin')"
          echo "$headers" | grep -i "^content-security-policy:" | grep -qF "$supabase_origin" \
            || { echo "CSP form-action does not list the Supabase origin" >&2; exit 1; }
