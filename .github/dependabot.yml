# Cotygodniowe aktualizacje zależności. Minor/patch npm trafiają do jednego
# zbiorczego PR-a, majory dostają osobne PR-y (te wymagają uwagi przy review).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
